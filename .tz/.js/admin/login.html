<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>এডমিন লগইন | Rupsha Jonokollan Foundation</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <div class="logo-dot"><i class="fa-solid fa-shield-halved"></i></div>
        <h1>এডমিন প্যানেল</h1>
        <p class="sub">Rupsha Jonokollan Foundation</p>
      </div>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm">
        <div class="field">
          <label>ইমেইল</label>
          <input type="email" id="loginEmail" required placeholder="admin@example.com" autocomplete="username">
        </div>
        <div class="field">
          <label>পাসওয়ার্ড</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">
          <i class="fa-solid fa-right-to-bracket"></i> লগইন করুন
        </button>
      </form>

      <p class="login-foot">শুধুমাত্র অনুমোদিত এডমিনরাই প্রবেশ করতে পারবেন</p>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
